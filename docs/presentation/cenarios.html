<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Cenários A–E do ISIA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: barra de separadores fixa; por cenário, mapa com replay à esquerda e fichas de parâmetros à direita. */
:root {
  --bg: #edf1ee; --surface: #ffffff; --map: #f7faf8; --ink: #15201b; --muted: #58675f; --line: #cdd6d0;
  --sensor: #1b5ea6; --res: #1a7551; --threat: #c42b2b; --benign: #6b6f76;
  --chg-bg: #ffe2ad; --chg-ink: #5c3600;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1512; --surface: #171f1b; --map: #131a17; --ink: #e5ece8; --muted: #93a29a; --line: #2b3730;
  --sensor: #6fb1f7; --res: #57c897; --threat: #ff6f66; --benign: #a3a8b0;
  --chg-bg: #5a3c08; --chg-ink: #ffdfa6; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1512; --surface: #171f1b; --map: #131a17; --ink: #e5ece8; --muted: #93a29a; --line: #2b3730;
  --sensor: #6fb1f7; --res: #57c897; --threat: #ff6f66; --benign: #a3a8b0;
  --chg-bg: #5a3c08; --chg-ink: #ffdfa6; color-scheme: dark }

* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans) }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
:focus-visible { outline: 2px solid var(--sensor); outline-offset: 2px }

header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
header .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 24px; padding-block: 8px }
h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .02em }
nav { display: flex; gap: 4px; overflow-x: auto; min-width: 0 }
nav a { display: flex; align-items: baseline; gap: 8px; padding: 6px 12px; border-radius: 6px; color: var(--muted); text-decoration: none; white-space: nowrap; font-size: 14px }
nav a b { font: 600 16px var(--mono); color: var(--ink) }
nav a:hover { background: var(--bg) }
nav a[aria-current] { background: var(--ink); color: var(--surface) }
nav a[aria-current] b { color: var(--surface) }
.score { margin-left: auto; font: 600 14px var(--mono); white-space: nowrap }
.score small { font: 400 12px var(--sans); color: var(--muted); margin-left: 12px }

main.wrap { padding-block: 24px 48px; display: grid; gap: 24px }
.intro { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 24px; align-items: center }
.letter { font: 600 88px/1 var(--mono); grid-row: span 2 }
h2 { margin: 0; font-size: 34px; line-height: 1.15; font-weight: 600; text-wrap: balance; align-self: end }
.intro p { margin: 0; max-width: 75ch; color: var(--muted); align-self: start }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin: 0; border-block: 1px solid var(--line) }
.facts div { padding: 12px 16px 12px 0 }
.facts dt, h3, .hud dt { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.facts dd { margin: 0; font: 600 26px/1.25 var(--mono) }
.facts small { display: block; font: 400 13px/1.35 var(--sans); color: var(--muted) }

.cols { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 32px; align-items: start }
@media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr) } .letter { font-size: 56px } h2 { font-size: 26px } .score small { display: none } }
.left, .right { display: grid; gap: 24px; min-width: 0 }
section { display: grid; gap: 8px; min-width: 0 }
.scroll { overflow-x: auto }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.note { margin: 0; font-size: 13px; color: var(--muted) }
button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; cursor: pointer; text-align: left }
button:hover:not(:disabled) { border-color: var(--ink) }
button:disabled { cursor: default }
.btn { background: var(--ink); border-color: var(--ink); color: var(--surface); font-weight: 600 }


/* Mapa e replay */
.mapbox { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px }
svg.map { display: block; width: 100%; height: auto }
svg text { font-family: var(--mono) }
.mk.res { transition: transform var(--step, 0ms) linear }
.pop .in { animation: pop .35s cubic-bezier(.2, 1.4, .4, 1) both; animation-delay: calc(var(--i) * 18ms); transform-box: fill-box; transform-origin: center }
@keyframes pop { from { opacity: 0; transform: scale(.2) } }
.ring { fill: none; stroke-width: 2.5 }
.ring.live { stroke: var(--threat); animation: pulse 1s ease-in-out infinite }
.ring.ok { stroke: var(--res) }
.ring.off { stroke: var(--benign); stroke-dasharray: 4 4 }
.ring.bad { stroke: var(--threat); stroke-dasharray: 4 4 }
@keyframes pulse { 50% { opacity: .3 } }
.legend, .chips, .log { margin: 0; padding: 0; list-style: none }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted) }
.legend li { display: flex; align-items: center; gap: 6px }
.legend svg { width: 18px; height: 18px; flex: none }
label.row { font-size: 14px; color: var(--muted); cursor: pointer }
.player input[type=range] { flex: 1 1 140px; min-width: 0 }
.player output { font: 600 16px var(--mono); min-width: 9ch; text-align: right }
.hud { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 }
.hud dd { margin: 0; font: 600 20px var(--mono) }
.chips { display: flex; flex-wrap: wrap; gap: 4px; font-size: 12px }
.chips li { padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); white-space: nowrap }
.chips .live { border-color: var(--threat); color: var(--threat) }
.chips .ok { background: var(--res); border-color: var(--res); color: var(--surface) }
.chips .off, .chips .idle { color: var(--muted); border-style: dashed }
.chips .bad { border-color: var(--threat); color: var(--threat); border-style: dashed; font-weight: 600 }
.log { font: 13px/1.5 var(--mono); min-height: 7.5em; border-left: 2px solid var(--line); padding-left: 12px; color: var(--muted) }
.log li:last-child { color: var(--ink) }
.log b { display: inline-block; min-width: 5ch }
.eps button code { display: block; font: 600 14px var(--mono) }
.eps button span { font-size: 13px; color: var(--muted) }
.eps button[aria-pressed="true"], .game button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink) }

/* Despachante */
.game .picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px }
.game .picks button { display: flex; gap: 8px; align-items: center; font-size: 14px }
.game .n { font: 600 14px var(--mono); width: 24px; height: 24px; border-radius: 50%; border: 1px dashed var(--line); display: grid; place-items: center; flex: none }
.game [aria-pressed="true"] .n { background: var(--ink); color: var(--surface); border-style: solid; border-color: var(--ink) }
.game ol { margin: 0; padding-left: 24px; font-size: 14px }
.game li.hit { font-weight: 600 }
.game li.hit::after { content: " ✓ acertou"; color: var(--res) }

/* Fichas */
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums }
th { text-align: right; font-size: 12px; font-weight: 500; color: var(--muted); padding: 4px 8px; vertical-align: bottom; line-height: 1.25 }
td { text-align: right; padding: 8px; border-top: 1px solid var(--line); font-family: var(--mono); white-space: nowrap }
th:first-child, td:first-child { text-align: left; padding-left: 0; font-family: var(--sans) }
td svg { width: 18px; height: 18px; vertical-align: -4px; margin-right: 6px }
td small { color: var(--muted) }
mark { background: var(--chg-bg); color: var(--chg-ink); font-weight: 600; padding: 1px 5px; border-radius: 3px; animation: flash .9s ease-out }
@keyframes flash { from { box-shadow: 0 0 0 6px var(--chg-bg) } to { box-shadow: 0 0 0 0 transparent } }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; margin: 0; font-size: 14px }
.kv dt, .kv dd { margin: 0; padding: 7px 0; border-top: 1px solid var(--line) }
.kv dd { text-align: right; font-family: var(--mono); padding-left: 16px }
.pill { display: inline-block; font: 600 12px var(--mono); padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted) }
.pill.on { background: var(--ink); border-color: var(--ink); color: var(--surface) }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important } }
</style>

<script>
const D = JSON.parse(document.getElementById('data').textContent);   // gerado por scripts/cenarios_html.py
const IDS = Object.keys(D);
const el = id => document.getElementById(id);
// Mundo do MVP, usado quando o cenário não traz "world" (runner.py: MVP_RESOURCES e base_sensors).
const MVP = { sensors: { 'sensor-1': { x: 2, y: 2 }, 'sensor-2': { x: 4, y: 2 } },
              res: { drone: { x: 0, y: 2 }, vehicle: { x: 0, y: 0 }, ranger: { x: 5, y: 5 } } };
const KIND = { acoustic: 'Sensor acústico', visual: 'Câmara', human: 'Informador humano' };
const EVENT = { threat: ['ameaça', 'ameaças'], thunder: ['trovão', 'trovões'], tourist: ['turista', 'turistas'] };
const RES = { drone: ['D', 'patrulha (drone)'], vehicle: ['V', 'patrulha (veículo)'], ranger: ['G', 'guarda'] };
const SIGNAL = { suspicious_movement: 'movimento suspeito (câmara)', suspicious_activity_report: 'relato de informador' };
const DEF = { sensitivity: 1, false_positive_rate: 0, false_negative_rate: 0, position_error: 0, confidence: 0.8 };
const POLICY = [['patrol_threshold', 'Limiar para enviar patrulha'], ['ranger_threshold', 'Limiar para chamar o guarda'],
  ['severe_threshold', 'Gravidade a partir da qual é grave'], ['severe_patrol_threshold', 'Limiar de patrulha em ocorrência grave'],
  ['ranger_min_groups', 'Grupos independentes para o guarda'], ['ranger_min_modalities', 'Modalidades diferentes para o guarda']];
const OPTIONS = [['max_receive_timeout', 'Prazo dinâmico', v => `teto ${num(v)} s`], ['queue_rounds', 'Fila de espera', v => `${v} rondas`],
  ['silent_invalid', 'Silêncio perante ACCEPT incoerente'], ['queue_priority', 'Fila por gravidade'],
  ['expire_unseen', 'Prazo de validade da ameaça'], ['queue_until_free', 'Recurso diz quando fica livre'],
  ['chain_missions', 'Encadear missões'], ['retransmit', 'Reenvio de mensagens', v => `${v}×`],
  ['alert_distance', 'Aviso entre iniciadores', v => `${num(v)} célula`], ['cfp_limit', 'CFP só aos K mais próximos', v => `K = ${v}`]];
// Estado de uma ocorrência no replay: [classe visual, texto].
const STATE = { verifying: ['live', 'a corroborar'], assessing: ['live', 'a avaliar'], allocating: ['live', 'à espera de recurso'],
  responding: ['live', 'recurso a caminho'], expired: ['off', 'expirada'], unresolved: ['bad', 'por resolver'] };

const num = (v, d = 2) => Number(v).toLocaleString('pt-PT', { maximumFractionDigits: d });
const pct = v => num(v * 100, 1) + ' %';
const pos = p => `(${p.x}, ${p.y})`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mk = (html, changed) => changed ? `<mark title="Difere do cenário A">${html}</mark>` : html;
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const plural = (n, [one, many]) => `${n} ${n === 1 ? one : many}`;
const sevName = (v, rs) => v >= rs.policy.severe_threshold ? ['grave', 'graves'] : v >= rs.severity ? ['média', 'médias'] : ['leve', 'leves'];
const still = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;

function model(c) {
  const w = c.world || {}, sp = { ...MVP.sensors, ...w.sensors }, sensors = [];
  const add = (id, p, starts) => sensors.push({ id, p, starts, ...DEF, ...c.sources[id] });
  add('sensor-1', sp['sensor-1'], true); add('sensor-2', sp['sensor-2'], false);
  for (const [id, p] of Object.entries(w.initiators || {})) add(id, p, true);
  for (const [id, p] of Object.entries(w.informants || {})) add(id, p, false);
  console.assert(sensors.length === Object.keys(c.sources).length, 'fontes sem posição em ' + c.scenario_id);
  const res = Object.entries(MVP.res).map(([type, p]) => {
    const o = c.resources[type] || {};
    return { id: type, type, p: o.position || p, autonomy: o.autonomy_percent ?? 100, load: o.load ?? 0 };
  });
  for (const [id, p] of Object.entries(w.patrols || {})) res.push({ id, type: 'drone', p, autonomy: 100, load: 0, extra: true });
  for (const [id, p] of Object.entries(w.rangers || {})) res.push({ id, type: 'ranger', p, autonomy: 100, load: 0, extra: true });
  // O replay tem de partir das mesmas bases que a configuração.
  for (const r of res) { const s = c.replay.res[r.id][0]; console.assert(s[1] === r.p.x && s[2] === r.p.y && s[3] === r.autonomy, 'replay difere da configuração: ' + c.scenario_id + ' ' + r.id); }
  return { w: w.width || 8, h: w.height || 8, sensors, res };
}
const M = Object.fromEntries(IDS.map(id => [id, model(D[id])]));
const A = D.A, MA = M.A;

// Marcadores: forma = tipo, preenchimento = papel (cheio inicia, vazio corrobora).
const glyph = {
  acoustic: s => `<circle r="7" fill="${s.starts ? 'var(--sensor)' : 'var(--map)'}" stroke="var(--sensor)" stroke-width="2.2"/>`,
  visual: s => `<rect x="-6.5" y="-6.5" width="13" height="13" rx="1.5" fill="${s.starts ? 'var(--sensor)' : 'var(--map)'}" stroke="var(--sensor)" stroke-width="2.2"/>`,
  human: s => `<path d="M0-8L7.5 6H-7.5Z" fill="${s.starts ? 'var(--sensor)' : 'var(--map)'}" stroke="var(--sensor)" stroke-width="2.2" stroke-linejoin="round"/>`,
  res: r => `<rect x="-8" y="-8" width="16" height="16" rx="4" fill="var(--res)"/><text y="3.6" text-anchor="middle" font-size="10" font-weight="600" fill="var(--map)">${RES[r.type][0]}</text>`,
  threat: () => `<path d="M-6-6L6 6M6-6L-6 6" fill="none" stroke="var(--threat)" stroke-width="3.2" stroke-linecap="round"/>`,
  thunder: () => `<path d="M2-8L-5 1H0L-2 8L5-1H0Z" fill="var(--benign)"/>`,
  tourist: () => `<path d="M0-7.5L7.5 0L0 7.5L-7.5 0Z" fill="none" stroke="var(--benign)" stroke-width="2.4"/>`,
};
const icon = g => `<svg viewBox="-11 -11 22 22" aria-hidden="true">${g}</svg>`;
const geo = m => { const C = 44, L = 26, T = 8, B = 22;   // y cresce para cima, como na documentação
  return { C, L, T, W: L + m.w * C + 8, H: T + m.h * C + B, cx: x => L + x * C + C / 2, cy: y => T + (m.h - 1 - y) * C + C / 2 }; };
const at = (track, t) => track.reduce((last, p) => p[0] <= t ? p : last, track[0]);

function mapSvg(m, events, range, pop) {
  const { C, L, T, W, H, cx, cy } = geo(m);
  const longest = Math.max(0, ...events.map(e => e.duration));
  const cells = new Map();
  const put = (p, svg, tip, attr = '') => { const k = p.x + ',' + p.y; (cells.get(k) || cells.set(k, { p, items: [] }).get(k)).items.push([svg + `<title>${esc(tip)}</title>`, attr]); };
  for (const s of m.sensors) put(s.p, glyph[s.kind](s), `${s.id} · ${KIND[s.kind]} · ${s.starts ? 'inicia a ocorrência' : 'corrobora'} · ${pos(s.p)} · alcance ${num(s.detection_range)}`);
  for (const e of events) {
    const short = e.duration < longest;
    put(e.position, glyph[e.kind]() + (short ? `<circle r="11" fill="none" stroke="var(--threat)" stroke-width="1.4" stroke-dasharray="3 3"/><text y="-14" text-anchor="middle" font-size="9" fill="var(--threat)">${num(e.duration)} s</text>` : ''),
      `${e.event_id} · ${EVENT[e.kind][0]} · ${pos(e.position)} · começa em t = ${num(e.starts_at)} s · dura ${num(e.duration)} s`);
  }
  for (const r of m.res) put(r.p, glyph.res(r), `${r.id} · ${RES[r.type][1]} · base ${pos(r.p)} · autonomia ${num(r.autonomy)} % · carga ${num(r.load)}`, ` data-res="${esc(r.id)}"`);
  let s = `<svg class="map${pop ? ' pop' : ''}" viewBox="0 0 ${W} ${H}" style="min-width:${m.w * 24}px" role="img" aria-label="Mapa ${m.w} por ${m.h} com fontes, recursos e eventos">`
    + `<clipPath id="clip"><rect x="${L}" y="${T}" width="${m.w * C}" height="${m.h * C}"/></clipPath>`
    + `<rect x="${L}" y="${T}" width="${m.w * C}" height="${m.h * C}" fill="var(--map)" stroke="var(--line)"/>`;
  for (let x = 1; x < m.w; x++) s += `<line x1="${L + x * C}" y1="${T}" x2="${L + x * C}" y2="${T + m.h * C}" stroke="var(--line)"/>`;
  for (let y = 1; y < m.h; y++) s += `<line x1="${L}" y1="${T + y * C}" x2="${L + m.w * C}" y2="${T + y * C}" stroke="var(--line)"/>`;
  for (let x = 0; x < m.w; x++) s += `<text x="${cx(x)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--muted)">${x}</text>`;
  for (let y = 0; y < m.h; y++) s += `<text x="${L - 8}" y="${cy(y) + 3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${y}</text>`;
  if (range) s += `<g clip-path="url(#clip)">` + m.sensors.map(o => `<circle cx="${cx(o.p.x)}" cy="${cy(o.p.y)}" r="${o.detection_range * C}" fill="var(--sensor)" fill-opacity=".05" stroke="var(--sensor)" stroke-opacity=".45" stroke-dasharray="${o.starts ? '' : '4 4'}"/>`).join('') + `</g>`;
  s += `<g id="rings"></g>`;
  let i = 0, late = '';
  for (const { p, items } of cells.values())
    items.forEach(([g, attr], k) => {
      const tf = `translate(${cx(p.x) + (k - (items.length - 1) / 2) * 20}px,${cy(p.y)}px)`;
      const node = `<g class="mk${attr ? ' res' : ''}"${attr} data-home="${tf}" style="transform:${tf}"><g class="in" style="--i:${i++}">${g}</g></g>`;
      if (attr) late += node; else s += node;   // recursos por cima de tudo
    });
  return s + late + '</svg>';
}

function sourcesTable(id, m) {
  const groups = new Map();
  for (const s of m.sensors) {
    const key = [s.kind, s.starts, s.detection_range, s.sensitivity, s.false_positive_rate, s.false_negative_rate, s.position_error, s.confidence].join('|');
    (groups.get(key) || groups.set(key, { ...s, count: 0 }).get(key)).count++;
  }
  const hit = s => s.sensitivity * (1 - s.false_negative_rate);
  const rows = [...groups.values()].map(g => {
    const ref = MA.sensors.find(s => s.kind === g.kind), d = (v, r) => id !== 'A' && ref && v !== r;
    const cell = (f, fmt) => `<td>${mk(fmt(g[f]), d(g[f], ref && ref[f]))}</td>`;
    return `<tr><td>${icon(glyph[g.kind](g))}${mk(KIND[g.kind], id !== 'A' && !ref)} <small>${g.starts ? 'inicia' : 'corrobora'}</small></td><td>${g.count}</td>`
      + cell('detection_range', num) + cell('sensitivity', num) + cell('false_positive_rate', pct) + cell('false_negative_rate', pct)
      + cell('position_error', v => v ? '±' + v : '0') + cell('confidence', num)
      + `<td>${mk(num(hit(g)), d(hit(g), ref && hit(ref)))}</td></tr>`;
  });
  return `<div class="scroll"><table><thead><tr><th>Fonte</th><th>N.º</th><th>Alcance<br>(células)</th><th>Sensibi-<br>lidade</th><th>Falsos<br>positivos</th><th>Falsos<br>negativos</th><th>Erro de<br>posição</th><th>Confiança<br>declarada</th><th>P(detetar<br>ameaça)</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}

function resourcesTable(id, m) {
  const rows = m.res.map(r => {
    const ref = MA.res.find(a => a.id === r.id), d = f => id !== 'A' && ref && !same(r[f], ref[f]);
    return `<tr><td>${icon(glyph.res(r))}${mk(esc(r.id), id !== 'A' && !ref)} <small>${RES[r.type][1]}</small></td>`
      + `<td>${mk(pos(r.p), d('p'))}</td><td>${mk(num(r.autonomy) + ' %', d('autonomy'))}</td><td>${mk(num(r.load), d('load'))}</td></tr>`;
  });
  return `<div class="scroll"><table><thead><tr><th>Recurso</th><th>Base (x, y)</th><th>Autonomia</th><th>Carga</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}

function faults(f) {
  if (!f) return `<p class="note">Sem falhas injetadas no transporte.</p>`;
  const label = { loss: 'Perda de mensagens', delay: 'Atraso na entrega', duplicate: 'Mensagens duplicadas' };
  const fmt = { loss: pct, delay: v => Object.entries(v).map(([k, s]) => `${k} ${num(s)} s`).join(' · '), duplicate: v => v.join(' · ') };
  return `<dl class="kv">${Object.entries(f).map(([k, v]) => `<dt>${label[k] || esc(k)}</dt><dd>${mk(esc(fmt[k] ? fmt[k](v) : JSON.stringify(v)), true)}</dd>`).join('')}</dl>`;
}

function severity(rs) {
  const by = rs.severity_by_source;
  if (!by) return `${num(rs.severity)} em todas`;
  const count = {};
  for (const v of Object.values(by)) count[v] = (count[v] || 0) + 1;
  return Object.keys(count).sort((a, b) => b - a).map(v => `${plural(count[v], sevName(+v, rs))} (${num(v)})`).join(' · ');
}

function policy(id, rs) {
  const ra = A.response_settings, row = (k, v, changed) => `<dt>${k}</dt><dd>${mk(v, id !== 'A' && changed)}</dd>`;
  return `<dl class="kv">`
    + POLICY.map(([k, label]) => row(label, num(rs.policy[k]), rs.policy[k] !== ra.policy[k])).join('')
    + row('Gravidade da ocorrência, por iniciador', severity(rs), !same([rs.severity, rs.severity_by_source], [ra.severity, ra.severity_by_source]))
    + row('Corrobora um som de tiro', rs.compatibility_rules.gunshot_like_sound.map(s => SIGNAL[s] || esc(s)).join(' · '), !same(rs.compatibility_rules, ra.compatibility_rules))
    + row('Prior da reputação', `α = ${num(rs.reputation.alpha)} · β = ${num(rs.reputation.beta)}`, !same(rs.reputation, ra.reputation))
    + row('Adjudicação: distância e atraso máximos', `${num(rs.adjudication.max_distance)} célula · ${num(rs.adjudication.max_delay_seconds)} s`, !same(rs.adjudication, ra.adjudication))
    + `</dl>`;
}

function options(o) {
  return `<dl class="kv">${OPTIONS.map(([k, label, fmt]) => {
    const v = o && o[k], on = v !== undefined && v !== null && v !== false && v !== 0;
    return `<dt>${label}</dt><dd><span class="pill ${on ? 'on' : ''}">${on ? 'ligado' + (fmt ? ' · ' + fmt(v) : '') : 'desligado'}</span></dd>`;
  }).join('')}</dl>`;
}

const epSummary = ep => {
  const count = {};
  for (const e of ep.events) count[e.kind] = (count[e.kind] || 0) + 1;
  return Object.entries(count).map(([k, n]) => plural(n, EVENT[k])).join(' + ') || 'sem eventos';
};

// ---------- Estado da página ----------
let cur, ep = 0, range = false, pick = [];
const rp = { t: 0, on: false, timer: null };          // replay: tempo simulado, visível?, temporizador
const score = { game: 0 };
const prev = {};                                      // últimos valores das fichas, para a contagem animada

// ---------- Replay ----------
function incState(i, t) {
  let s = null;
  for (const x of i.st) if (x[0] <= t) s = x;
  if (!s) return ['off', i.st.length ? 'ainda sem alerta' : 'sem alerta'];
  if (s[1] === 'closed') return i.reason === 'confirmed' ? ['ok', 'confirmada'] : ['off', 'nada confirmado'];
  return STATE[s[1]];
}
const endOf = i => i.st.length ? i.st[i.st.length - 1][0] : 0;

function drawReplay() {
  const r = D[cur].replay, g = geo(M[cur]), t = rp.t;
  document.querySelectorAll('#map [data-res]').forEach(n => {
    const p = at(r.res[n.dataset.res], t), home = r.res[n.dataset.res][0];
    n.style.transform = !rp.on || (p[1] === home[1] && p[2] === home[2]) ? n.dataset.home : `translate(${g.cx(p[1])}px,${g.cy(p[2])}px)`;
  });
  el('rings').innerHTML = !rp.on ? '' : r.inc.map(i => {
    const [cls] = incState(i, t);
    return `<g style="transform:translate(${g.cx(i.target.x)}px,${g.cy(i.target.y)}px)"><circle r="17" class="ring ${cls}"/>${cls === 'ok' ? '<path d="M9-17l4 4 7-9" fill="none" stroke="var(--res)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>' : ''}</g>`;
  }).join('');
  const used = Object.values(r.res).reduce((sum, track) => sum + track[0][3] - at(track, t)[3], 0);
  const done = r.inc.filter(i => incState(i, t)[0] === 'ok').length;
  el('seek').value = t;
  el('clock').textContent = `t = ${num(t)} s`;
  el('play').textContent = rp.timer ? '❚❚ Pausar' : t >= r.tmax ? '↺ Repetir' : '▶ Reproduzir';
  el('h-msg').textContent = rp.on ? r.msgs.reduce((n, m) => m[0] <= t ? m[1] : n, 0) : 0;
  el('h-en').textContent = num(rp.on ? used : 0, 1) + ' p.p.';
  el('h-ok').textContent = `${rp.on ? done : 0} / ${r.inc.length}`;
  const rs = D[cur].response_settings;
  el('incs').innerHTML = r.inc.map(i => {
    const [cls, txt] = rp.on ? incState(i, t) : ['idle', 'por começar'];
    const ended = rp.on && t >= endOf(i) && i.why && cls !== 'live';
    return `<li class="${cls}" title="${esc(ended ? i.why : '')}">${esc(i.id)}${rs.severity_by_source ? ' · ' + sevName(i.sev, rs)[0] : ''} · ${txt}</li>`;
  }).join('');
  const lines = rp.on ? r.log.filter(l => l[0] <= t).slice(-5) : [];
  el('log').innerHTML = lines.map(l => `<li><b>${num(l[0])} s</b> ${esc(l[1])}</li>`).join('') || '<li>Carregue em Reproduzir para ver a execução passo a passo.</li>';
}
function stop() { clearInterval(rp.timer); rp.timer = null; }
function play() {
  const r = D[cur].replay;
  if (rp.timer) { stop(); return drawReplay(); }
  if (ep !== r.ep) { ep = r.ep; drawMap(); }
  if (rp.t >= r.tmax) rp.t = 0;
  rp.on = true;
  const step = Math.max(120, Math.min(600, 18000 / r.tmax));   // a execução inteira cabe em cerca de 18 s
  el('map').style.setProperty('--step', step + 'ms');
  rp.timer = setInterval(() => { rp.t = Math.min(r.tmax, rp.t + 1); if (rp.t >= r.tmax) stop(); drawReplay(); }, step);
  drawReplay();
}

// ---------- Mapa ----------
function drawMap(pop) {
  const c = D[cur], evs = c.episodes[ep].events;
  el('map').innerHTML = mapSvg(M[cur], evs, range, pop && !still);
  const groups = {};
  for (const e of evs) { const k = `${EVENT[e.kind][0]} · começa em t = ${num(e.starts_at)} s · dura ${num(e.duration)} s`; groups[k] = (groups[k] || 0) + 1; }
  el('epnote').textContent = Object.entries(groups).map(([k, n]) => `${n} × ${k}`).join('; ') || 'Episódio vazio: nenhum evento, nunca gera sinal.';
  document.querySelectorAll('.eps button').forEach((b, i) => b.setAttribute('aria-pressed', i === ep));
  drawReplay();
}

function drawScore() {
  const games = IDS.filter(id => gameList(id)).reduce((n, id) => n + D[id].replay.inc.length, 0);
  el('score').textContent = `Pontos ${score.game} / ${games}`;
}

// ---------- Despachante ----------
// Só faz sentido com várias ocorrências de gravidades diferentes e poucas o bastante para ordenar à mão.
function gameList(id) { const r = D[id].replay; return D[id].response_settings.severity_by_source && r.inc.length >= 3 && r.inc.length <= 8 ? r.inc : null; }
function drawGame() {
  const list = gameList(cur);
  if (!list) return void (el('game').innerHTML = '');
  const c = D[cur], rs = c.response_settings, m = M[cur], rangers = m.res.filter(r => r.type === 'ranger').length;
  const label = i => `${esc(i.id)} em ${pos(i.target)} · ${sevName(i.sev, rs)[0]}${i.dur < 1000 ? ` · dura só ${num(i.dur)} s` : ''}`;
  const rank = i => i.reason === 'confirmed' ? endOf(i) : 1e9;
  const sys = [...list].sort((a, b) => rank(a) - rank(b));
  const done = pick.length === list.length, hits = sys.filter((i, k) => pick[k] === i.id).length;
  if (done) score.game = Math.max(score.game, hits);
  el('game').innerHTML = `<h3>Seja o despachante</h3>
    <p class="note">${plural(list.length, ['ameaça', 'ameaças'])} ao mesmo tempo, ${plural(m.res.length - rangers, ['patrulha', 'patrulhas'])} e ${plural(rangers, ['guarda', 'guardas'])}. Clique nas ocorrências pela ordem em que as atenderia.</p>
    <div class="picks">${list.map(i => `<button type="button" data-pick="${esc(i.id)}" aria-pressed="${pick.includes(i.id)}"><span class="n">${pick.indexOf(i.id) + 1 || ''}</span>${label(i)}</button>`).join('')}</div>
    ${done ? `<p><strong>${hits} de ${list.length} posições iguais às do sistema.</strong> Ordem em que o sistema fechou as ocorrências na execução gravada:</p>
      <ol>${sys.map((i, k) => `<li class="${pick[k] === i.id ? 'hit' : ''}">${label(i)} · ${i.reason === 'confirmed' ? `fechada aos ${num(endOf(i))} s` : 'não atendida: ' + esc(i.why)}</li>`).join('')}</ol>
      <p class="note">Não há despachante central: cada recurso ordena a sua fila pela gravidade. Veja no replay.</p>` : ''}
    ${pick.length ? `<div><button type="button" data-pick="">Recomeçar</button></div>` : ''}`;
  drawScore();
}

// ---------- Página ----------
function countUp() {
  document.querySelectorAll('[data-n]').forEach(node => {
    const to = +node.dataset.n, from = prev[node.dataset.k] ?? to, t0 = performance.now();
    prev[node.dataset.k] = to;
    if (from === to || still) return;
    const frame = now => { const p = Math.min(1, (now - t0) / 450); node.textContent = Math.round(from + (to - from) * p); if (p < 1) requestAnimationFrame(frame); };
    requestAnimationFrame(frame);
  });
}

function render() {
  const h = location.hash.slice(1).toUpperCase();
  stop(); cur = h in D ? h : IDS[0]; ep = D[cur].replay.ep; rp.t = 0; rp.on = false; pick = [];
  const c = D[cur], m = M[cur], [name, ...rest] = c.description.split(': '), text = rest.join(': ');
  el('tabs').innerHTML = IDS.map(id => `<a href="#${id.toLowerCase()}"${id === cur ? ' aria-current="page"' : ''}><b>${id}</b>${esc(D[id].description.split(': ')[0])}</a>`).join('');
  const threats = Math.max(...c.episodes.map(e => e.events.filter(v => v.kind === 'threat').length));
  const starts = m.sensors.filter(s => s.starts).length, rangers = m.res.filter(r => r.type === 'ranger').length;
  const runs = c.repetitions * c.episodes.length, kinds = [...new Set(m.sensors.map(s => s.kind))];
  const evKinds = [...new Set(c.episodes.flatMap(e => e.events.map(v => v.kind)))];
  const legend = [
    ...kinds.map(k => [glyph[k]({ starts: true }), KIND[k]]),
    [glyph.acoustic({ starts: true }), 'cheio: inicia'], [glyph.acoustic({ starts: false }), 'vazio: corrobora'],
    ...[...new Set(m.res.map(r => r.type))].map(t => [glyph.res({ type: t }), RES[t][1]]),
    ...evKinds.map(k => [glyph[k](), EVENT[k][0]]),
  ];
  const n = (k, v) => `<span data-k="${k}" data-n="${v}">${v}</span>`;
  el('app').innerHTML = `
    <div class="intro"><div class="letter">${cur}</div><h2>${esc(name)}</h2><p>${esc(text[0].toUpperCase() + text.slice(1))}</p></div>
    <dl class="facts">
      <div><dt>Mapa</dt><dd>${m.w} × ${m.h}<small>células</small></dd></div>
      <div><dt>Ameaças em simultâneo</dt><dd>${n('threats', threats)}<small>no episódio mais carregado</small></dd></div>
      <div><dt>Fontes</dt><dd>${n('sources', m.sensors.length)}<small>${starts} ${starts === 1 ? 'inicia' : 'iniciam'}, ${m.sensors.length - starts} ${m.sensors.length - starts === 1 ? 'corrobora' : 'corroboram'}</small></dd></div>
      <div><dt>Recursos</dt><dd>${n('res', m.res.length)}<small>${plural(m.res.length - rangers, ['patrulha', 'patrulhas'])}, ${plural(rangers, ['guarda', 'guardas'])}</small></dd></div>
      <div><dt>Execuções por variante</dt><dd>${n('runs', runs)}<small>${c.repetitions} sementes (${c.base_seed}–${c.base_seed + c.repetitions - 1}) × ${plural(c.episodes.length, ['episódio', 'episódios'])}</small></dd></div>
    </dl>
    <div class="cols">
      <div class="left">
        <section><h3>Mapa da reserva</h3>
          <div class="mapbox scroll" id="map"></div>
          <ul class="legend">${legend.map(([g, t]) => `<li>${icon(g)}${t}</li>`).join('')}</ul>
          <label class="row"><input type="checkbox" id="range"${range ? ' checked' : ''}> Mostrar o alcance de deteção de cada fonte</label>
        </section>
        <section><h3>Replay de uma execução real</h3>
          <div class="row player"><button type="button" class="btn" id="play"></button>
            <input type="range" id="seek" min="0" max="${c.replay.tmax}" step="1" value="0" aria-label="Tempo simulado em segundos"><output id="clock" for="seek"></output></div>
          <dl class="hud"><div><dt>Mensagens</dt><dd id="h-msg"></dd></div><div><dt>Energia gasta</dt><dd id="h-en"></dd></div><div><dt>Confirmadas</dt><dd id="h-ok"></dd></div></dl>
          <ul class="chips" id="incs"></ul>
          <ol class="log" id="log" aria-live="off"></ol>
          <p class="note"><code>${esc(c.replay.run)}</code>, episódio <code>${esc(c.episodes[c.replay.ep].label)}</code>. ${esc(c.replay.note)}</p>
        </section>
        <section><h3>Episódios</h3>
          <div class="row eps">${c.episodes.map((e, i) => `<button type="button" data-ep="${i}"><code>${esc(e.label)}</code><span>${epSummary(e)}</span></button>`).join('')}</div>
          <p class="note" id="epnote"></p>
        </section>
        <section class="game" id="game"></section>
      </div>
      <div class="right">
        ${cur === 'A' ? '' : `<p class="note"><mark>Destacado</mark> = valor diferente do cenário A.</p>`}
        <section><h3>Fontes de observação</h3>${sourcesTable(cur, m)}</section>
        <section><h3>Recursos</h3>${resourcesTable(cur, m)}</section>
        <section><h3>Falhas de comunicação</h3>${faults(c.faults)}</section>
        <section><h3>Política de decisão</h3>${policy(cur, c.response_settings)}</section>
        <section><h3>Mecanismos de escala</h3>${options(c.options)}</section>
      </div>
    </div>`;
  drawMap(true); drawGame(); drawScore(); countUp();
}

el('app').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.id === 'play') play();
  else if ('ep' in b.dataset) { stop(); rp.t = 0; rp.on = false; ep = +b.dataset.ep; drawMap(); }
  else if ('pick' in b.dataset) {
    const id = b.dataset.pick;
    pick = !id ? [] : pick.includes(id) ? pick.filter(p => p !== id) : [...pick, id];
    drawGame();
  }
});
el('app').addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'range') { range = e.target.checked; drawMap(); }
  else if (id === 'seek') { stop(); if (ep !== D[cur].replay.ep) { ep = D[cur].replay.ep; drawMap(); } rp.on = true; rp.t = +e.target.value; el('map').style.setProperty('--step', '0ms'); drawReplay(); }
});
addEventListener('keydown', e => {
  const step = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
  if (!step || e.target.closest('input, button') || e.altKey || e.ctrlKey || e.metaKey) return;
  location.hash = IDS[(IDS.indexOf(cur) + step + IDS.length) % IDS.length].toLowerCase();
});
addEventListener('hashchange', render);
render();
</script>
